<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Meal Invitation</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><span>✦ YOU'RE INVITED</span><a href="admin.html">Host</a></header><article><section class="hero"><p>LET'S CELEBRATE</p><h1 id="title">Birthday Dinner</h1><p id="subtitle"></p></section><section class="details"><p>📅 <strong id="date"></strong></p><p>🕓 <strong id="time"></strong></p><p>📍 <strong id="venue"></strong></p><p id="address"></p></section><section class="body"><h2 id="greeting">Your invitation</h2><p id="welcome"></p><p id="gift" class="gift"></p><p id="notice" role="status">Loading your invitation…</p><form id="form" hidden><fieldset><legend>Can you join us?</legend><label><input type="radio" name="rsvp" value="yes" required> Yes, I'll be there!</label><label><input type="radio" name="rsvp" value="maybe"> Maybe, not sure yet</label><label><input type="radio" name="rsvp" value="no"> Sorry, I can't make it</label></fieldset><label class="field">Number attending<input id="count" type="number" min="0" max="30" value="1" required></label><label class="field">Dietary requirements<textarea id="diet" maxlength="500" rows="2" placeholder="Optional"></textarea></label><label class="field">Message to the host<textarea id="note" maxlength="500" rows="2" placeholder="Optional"></textarea></label><button id="send" type="submit">Send RSVP ✨</button></form></section></article><footer>Made with ♥ for a birthday celebration</footer></main><script src="config.js"></script><script src="app.js"></script></body></html>
